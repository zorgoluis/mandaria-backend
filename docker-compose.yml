name: mandaria
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mandaria}
      POSTGRES_DB: ${POSTGRES_DB:-mandaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mandaria}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mandaria}?schema=public&connect_timeout=5&socket_timeout=5
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      INTEGRATION_JWT_SECRET: ${INTEGRATION_JWT_SECRET:?Set INTEGRATION_JWT_SECRET}
      INTEGRATION_ACCESS_TOKEN_EXPIRES_IN: ${INTEGRATION_ACCESS_TOKEN_EXPIRES_IN:-3600}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-900}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-604800}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    init: true
volumes:
  postgres_data:
