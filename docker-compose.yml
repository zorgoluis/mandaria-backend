name: mandaria
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mandaria}
      POSTGRES_DB: ${POSTGRES_DB:-mandaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mandaria}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mandaria}?schema=public&connect_timeout=5&socket_timeout=5
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      INTEGRATION_JWT_SECRET: ${INTEGRATION_JWT_SECRET:?Set INTEGRATION_JWT_SECRET}
      INTEGRATION_ACCESS_TOKEN_EXPIRES_IN: ${INTEGRATION_ACCESS_TOKEN_EXPIRES_IN:-3600}
      DEFAULT_FLEET_MAX_DRIVERS: ${DEFAULT_FLEET_MAX_DRIVERS:-10}
      DEFAULT_FLEET_MAX_VEHICLES: ${DEFAULT_FLEET_MAX_VEHICLES:-10}
      DEFAULT_INDEPENDENT_MAX_DRIVERS: ${DEFAULT_INDEPENDENT_MAX_DRIVERS:-1}
      DEFAULT_INDEPENDENT_MAX_VEHICLES: ${DEFAULT_INDEPENDENT_MAX_VEHICLES:-2}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-900}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-604800}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-local_outbox}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MANDARIA_WEB_URL: ${MANDARIA_WEB_URL:-}
      B2B_WEBHOOK_SECRET_KEY: ${B2B_WEBHOOK_SECRET_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      PARTNER_APPLICATIONS_NOTIFY_EMAIL: ${PARTNER_APPLICATIONS_NOTIFY_EMAIL:-}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-google}
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}
      GOOGLE_ROUTES_TIMEOUT_MS: ${GOOGLE_ROUTES_TIMEOUT_MS:-5000}
      GOOGLE_ROUTES_MAX_RETRIES: ${GOOGLE_ROUTES_MAX_RETRIES:-1}
      GOOGLE_ROUTES_TRAVEL_MODE: ${GOOGLE_ROUTES_TRAVEL_MODE:-DRIVE}
      # Optional features remain disabled unless explicitly enabled.
      LOCATION_IP_PER_MINUTE: ${LOCATION_IP_PER_MINUTE:-60}
      LOCATION_TRACKING_ENABLED: ${LOCATION_TRACKING_ENABLED:-false}
      SHARED_TRACKING_ENABLED: ${SHARED_TRACKING_ENABLED:-false}
      LOCATION_DRIVER_PER_MINUTE: ${LOCATION_DRIVER_PER_MINUTE:-30}
      LOCATION_OWNER_PER_MINUTE: ${LOCATION_OWNER_PER_MINUTE:-60}
      LOCATION_RECIPIENT_PER_MINUTE: ${LOCATION_RECIPIENT_PER_MINUTE:-12}
      LOCATION_LINK_MUTATIONS_PER_TEN_MINUTES: ${LOCATION_LINK_MUTATIONS_PER_TEN_MINUTES:-5}
      CUSTOMER_ADMISSION_ENABLED: ${CUSTOMER_ADMISSION_ENABLED:-false}
      CUSTOMER_CHALLENGE_TTL_SECONDS: ${CUSTOMER_CHALLENGE_TTL_SECONDS:-1800}
      DETAILED_EXECUTION_ENABLED: ${DETAILED_EXECUTION_ENABLED:-false}
      PREQUOTE_AUTHORIZED_ACCEPT_ENABLED: ${PREQUOTE_AUTHORIZED_ACCEPT_ENABLED:-false}
      PREQUOTE_CONVERSION_ENABLED: ${PREQUOTE_CONVERSION_ENABLED:-false}
      PREQUOTE_ENABLED: ${PREQUOTE_ENABLED:-false}
      PREQUOTE_VALIDITY_MS: ${PREQUOTE_VALIDITY_MS:-900000}
      PREQUOTE_LEASE_MS: ${PREQUOTE_LEASE_MS:-90000}
      PREQUOTE_MAX_ATTEMPTS: ${PREQUOTE_MAX_ATTEMPTS:-3}
      PREQUOTE_PER_MINUTE: ${PREQUOTE_PER_MINUTE:-10}
      PREQUOTE_PER_DAY: ${PREQUOTE_PER_DAY:-500}
      PREQUOTE_MAX_CONCURRENT: ${PREQUOTE_MAX_CONCURRENT:-2}
      PREQUOTE_PERMIT_RESERVE_MS: ${PREQUOTE_PERMIT_RESERVE_MS:-30000}
      PREQUOTE_GLOBAL_DAILY_ROUTING_UNITS: ${PREQUOTE_GLOBAL_DAILY_ROUTING_UNITS:-}
      USER_INVITATION_TTL_HOURS: ${USER_INVITATION_TTL_HOURS:-24}
      USER_INVITATION_RESEND_COOLDOWN_SECONDS: ${USER_INVITATION_RESEND_COOLDOWN_SECONDS:-60}
      LOCAL_MAIL_OUTBOX_DIR: ${LOCAL_MAIL_OUTBOX_DIR:-}
      DISPATCH_TTL_MINUTES: ${DISPATCH_TTL_MINUTES:-10}
      LOCAL_DELIVERY_ASSIGNMENT_TTL_MINUTES: ${LOCAL_DELIVERY_ASSIGNMENT_TTL_MINUTES:-5}
      INDEPENDENT_DRIVER_MAX_VEHICLES: ${INDEPENDENT_DRIVER_MAX_VEHICLES:-3}
      B2B_WEBHOOK_TIMEOUT_MS: ${B2B_WEBHOOK_TIMEOUT_MS:-5000}
      B2B_WEBHOOK_ALLOW_INSECURE_TARGETS: ${B2B_WEBHOOK_ALLOW_INSECURE_TARGETS:-false}
      B2B_WEBHOOK_POLL_SECONDS: ${B2B_WEBHOOK_POLL_SECONDS:-15}
      B2B_WEBHOOK_LEASE_SECONDS: ${B2B_WEBHOOK_LEASE_SECONDS:-60}
      RUN_DB_SEED: ${RUN_DB_SEED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    init: true
volumes:
  postgres_data:
